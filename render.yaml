# ─── Render.com deployment config ───────────────────────────────────────────
# This deploys the ENTIRE app (backend + frontend) as a single Render Web Service.
#
# How it works:
#   1. Build command: installs frontend deps + builds React → frontend/dist
#                     installs backend deps
#   2. Start command: runs the Node.js server which serves frontend/dist statically
#
# Setup steps:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com → New → Web Service
#   3. Connect your GitHub repo
#   4. Render will auto-detect render.yaml and fill in all settings
#   5. Click "Create Web Service"
#   6. Wait ~3 minutes for the first build
#   7. Your game is live at https://<your-service>.onrender.com
#      - Players: https://<your-service>.onrender.com/
#      - Host:    https://<your-service>.onrender.com/host

services:
  - type: web
    name: guess-the-song
    env: node
    region: singapore   # closest free region to India; change to frankfurt / ohio etc. if needed
    plan: free
    rootDir: backend
    buildCommand: |
      cd ../frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns this; just matching the default
    # Render free tier does NOT have a persistent disk by default.
    # songs.json will reset on each redeploy.  Use the env var approach below
    # if you want persistence, or upgrade to the $7/month plan with a disk.
    autoDeploy: true
